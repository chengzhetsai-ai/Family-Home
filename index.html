<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>幸福小家</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#34463e;font:var(--fs,16px) system-ui;padding-bottom:100px}header,button.primary{background:var(--theme,#527861);color:white}header{padding:22px;display:flex;justify-content:space-between;align-items:center}h1,h2{margin:0 0 12px}h1{font-size:1.6em}h2{font-size:1.25em}main{max-width:650px;margin:auto;padding:15px}.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;overflow-wrap:anywhere}.hero{background:#dfeade}button,input,select,textarea{font:inherit;border-radius:10px;padding:11px;border:1px solid #ccd5cc}button{cursor:pointer;background:white;color:inherit}input,select,textarea{width:100%;min-width:0;margin:5px 0}.primary{width:100%;margin-top:8px;border:0}nav{position:fixed;bottom:0;background:white;width:100%;display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-top:1px solid #ddd}nav button{flex:1;border:0;padding:5px;font-size:.8em}nav span{display:block;font-size:1.7em}.page{display:none}.active{display:block}.row{display:flex;align-items:center;gap:8px;justify-content:space-between}.entry{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.entry div{flex:1}.entry input{width:22px}.del{background:#f4e5e5;color:#a34b4b;border:0}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}.day{min-height:65px;padding:4px 0;border:0;border-top:1px solid #eee;font-weight:bold}.day small{display:block;font-size:10px}.weekend,.late{color:#c34e4e}.today{background:#e5eee5}.event{background:#ffdbad}.selected{outline:2px solid var(--theme,#527861);outline-offset:-2px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tile{background:#f5f5ef}.chosen{background:#dce8dc;border:2px solid var(--theme,#527861)}.amount{font-size:2em;font-weight:bold}small{color:#68786e}.bar{height:9px;background:var(--theme,#527861);border-radius:5px}label{display:block;margin-top:8px}pre{white-space:pre-wrap}
</style><header><div><h1 id="heading"></h1><small style="color:white" id="subtitle"></small></div><button onclick="show('settings')">⚙️</button></header><main>
<section id="home" class="page active"><div class="card hero"><h2 id="slogan"></h2><div id="blessing"></div></div><div class="card" onclick="show('life')"><h2>📅 家庭生活</h2><div id="taskSummary"></div></div><div class="card" onclick="show('money')"><h2>💰 家庭財務</h2><div class="amount" id="moneySummary"></div><small>本月支出</small></div><div class="card" onclick="show('memory')"><h2>❤️ 家庭記憶</h2><div id="memorySummary"></div></div></section>
<section id="life" class="page"><div class="card"><div class="row"><button onclick="shift(-1)">❮</button><b id="calTitle"></b><button onclick="shift(1)">❯</button></div><div class="grid" id="calendar"></div><button class="primary" onclick="pick(today())">回到今天</button></div><div class="card"><h2>📅 家庭待辦事項</h2><b id="selectedDate"></b><input id="taskInput" placeholder="輸入待辦事項"><button class="primary" onclick="addTask()">＋ 新增事項</button><div id="taskList"></div></div><div class="card"><h2>📋 近期家庭待辦</h2><div id="upcoming"></div></div><div class="card"><h2>已完成紀錄</h2><div id="completed"></div></div></section>
<section id="money" class="page"><div class="card hero"><div class="row"><button onclick="moneyShift(-1)">❮</button><b id="moneyMonth"></b><button onclick="moneyShift(1)">❯</button></div><p>當月支出</p><div class="amount" id="total"></div><p id="otherTotals"></p></div><div class="card"><h2>近六個月支出</h2><div id="trend"></div></div><div class="card"><h2>💰 新增支出</h2><div class="tiles" id="categories"></div><p>選擇細項</p><div class="tiles" id="items"></div><p id="locked"></p><input id="expenseName" placeholder="自訂項目名稱（選填）"><label>支出日期</label><input id="expenseDate" type="date"><input id="expenseAmount" type="number" min="0.01" step="0.01" placeholder="金額"><input id="note" placeholder="備註（選填）"><button class="primary" onclick="addExpense()">儲存支出</button></div><div class="card"><h2>當月分類分析</h2><div id="breakdown"></div></div><div class="card"><h2>當月支出紀錄</h2><div id="expenseList"></div></div><div class="card"><h2>未填日期的歷史紀錄</h2><div id="undated"></div></div></section>

<section id="settings" class="page"><div class="card"><h2>⚙️ 系統設定</h2><label>APP 名稱</label><input id="stName"><label>英文副標題</label><input id="stSub"><label>首頁標語</label><input id="stSlogan"><label>祝福文字</label><input id="stBless"><label>家庭圖示</label><input id="stIcon"><label>主題顏色</label><select id="stTheme"><option value="#527861">森林綠</option><option value="#456d91">海洋藍</option><option value="#94677d">柔和粉</option><option value="#866746">暖棕</option></select><label>字體大小</label><select id="stFont"><option value="16">標準</option><option value="18">大</option><option value="20">特大</option></select><label>農曆<select id="stLunar"><option value="true">顯示</option><option value="false">隱藏</option></select></label><label>節慶與節氣<select id="stFest"><option value="true">顯示</option><option value="false">隱藏</option></select></label><button class="primary" onclick="saveSettings()">儲存設定</button><button class="primary" onclick="resetSettings()">恢復預設介面</button></div><div class="card"><h2>資料管理</h2><p>備份包含私人資料，請妥善保存。</p><button class="primary" onclick="backup()">匯出 JSON 備份</button><label>還原備份（取代目前資料）</label><input type="file" accept=".json,application/json" onchange="restore(this)"><button class="primary" onclick="csv()">匯出所選月份 CSV</button></div></section></main><nav><button onclick="show('home')"><span>🏠</span>首頁</button><button onclick="show('life')"><span>📅</span>生活</button><button onclick="show('money')"><span>💰</span>財務</button><button onclick="show('memory')"><span>❤️</span>回憶</button><button onclick="show('family')"><span>👥</span>家庭</button></nav>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=()=>key(new Date()), money=n=>'NT$ '+n.toLocaleString('zh-TW'), validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T12:00:00'));
function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}let tasks=load('fh_tasks',[]),expenses=load('fh_expenses',[]),memories=load('fh_memories',[]);const defaults={name:'幸福小家',sub:'FAMILY HOME',slogan:'平凡生活，幸福相伴',bless:'一起照顧生活，珍惜每一天。',icon:'🏡',theme:'#527861',font:'16',lunar:'true',fest:'true'};let settings={...defaults,...load('fh_settings',{})};let selected=today(),cal=new Date(),mon=new Date();tasks.forEach(t=>{if(!t.date)t.date=today()});function save(){try{for(const [k,v] of Object.entries({tasks,expenses,memories,settings}))localStorage.setItem('fh_'+k,JSON.stringify(v))}catch(e){alert('儲存失敗，請先備份資料')}render()}
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));if(id==='settings')fillSettings();window.scrollTo(0,0)}function pick(d){selected=d;cal=new Date(d+'T12:00:00');render()}function shift(n){cal=new Date(cal.getFullYear(),cal.getMonth()+n,1);selected=key(cal);render()}function moneyShift(n){mon=new Date(mon.getFullYear(),mon.getMonth()+n,1);render()}
const ld=['','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'],lm=['','正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','臘月'];const lf={'1-1':'春節','1-15':'元宵節','2-2':'土地公生','5-5':'端午節','7-7':'七夕','7-15':'中元節','8-15':'中秋節','9-9':'重陽節','10-15':'下元節','12-8':'臘八節'},ff={'1-1':'元旦','2-14':'情人節','2-28':'和平紀念日','4-4':'兒童節','5-1':'勞動節','10-10':'國慶日','11-12':'國父誕辰','12-25':'聖誕節'},terms='小寒 大寒 立春 雨水 驚蟄 春分 清明 穀雨 立夏 小滿 芒種 夏至 小暑 大暑 立秋 處暑 白露 秋分 寒露 霜降 立冬 小雪 大雪 冬至'.split(' '),mins=[0,21208,42467,63836,85337,107014,128867,150921,173149,195551,218072,240693,263343,285989,308563,331033,353350,375494,397447,419210,440795,462224,483532,504758];function lunar(d){try{const p=new Intl.DateTimeFormat('en-u-ca-chinese-nu-latn',{month:'numeric',day:'numeric',timeZone:'Asia/Taipei'}).formatToParts(new Date(key(d)+'T12:00:00+08:00'));let m=p.find(x=>x.type==='month').value,n=Number(p.find(x=>x.type==='day').value),leap=/bis|leap/i.test(m);m=parseInt(m);return [n===1?(leap?'閏':'')+lm[m]:ld[n],leap?'':lf[m+'-'+n]]}catch{return ['','']}}function calendar(){let y=cal.getFullYear(),m=cal.getMonth();$('calTitle').textContent=`${y} 年 ${m+1} 月`;let h='日一二三四五六'.split('').map(x=>`<small style="text-align:center">${x}</small>`).join('')+'<div></div>'.repeat(new Date(y,m,1).getDay());for(let i=1;i<=new Date(y,m+1,0).getDate();i++){let d=new Date(y,m,i),k=key(d),[l,f]=lunar(d),w=d.getDay(),n=tasks.filter(t=>t.date===k&&!t.done).length;f=ff[`${m+1}-${i}`]||f;if(m===4&&w===0&&i>=8&&i<=14)f='母親節';if(m===7&&i===8)f='父親節';if(m===10&&w===4&&i>=22&&i<=28)f='感恩節';for(let j=m*2;j<m*2+2;j++)if(new Date(Date.UTC(1900,0,6,2,5)+31556925974.7*(y-1900)+mins[j]*60000).getUTCDate()===i)f=f||terms[j];h+=`<button class="day ${w===0||w===6?'weekend':''} ${k===today()?'today':''} ${n?'event':''} ${k===selected?'selected':''}" onclick="pick('${k}')">${i}<small>${esc(settings.lunar==='true'?l:'')}</small><small style="color:#b56b25">${esc(settings.fest==='true'?f:'')}</small>${n?`<small>● ${n}件</small>`:''}</button>`}$('calendar').innerHTML=h;$('selectedDate').textContent='選擇日期：'+selected}
function addTask(){let text=$('taskInput').value.trim();if(!text)return;tasks.push({text,date:selected,done:false});$('taskInput').value='';save()}function toggle(i){tasks[i].done=!tasks[i].done;save()}function del(t,i){if(confirm('確定刪除？')){({tasks,expenses,memories}[t]).splice(i,1);save()}}function taskRow(t,i){let n=Math.round((Date.parse(t.date)-Date.parse(today()))/86400000),label=n<0?`逾期 ${-n} 天`:n===0?'今天':n===1?'明天':`${n} 天後`;return `<div class="entry"><input type="checkbox" ${t.done?'checked':''} onchange="toggle(${i})"><div><button onclick="pick('${validDate(t.date)?t.date:today()}')">${esc(t.date)}</button> <small class="${n<0&&!t.done?'late':''}">${t.done?'已完成':label}</small><div>${esc(t.text)}</div></div><button class="del" onclick="del('tasks',${i})">刪除</button></div>`}
const cats=[['🍜 食','🍳 早餐','🍱 午餐','🍲 晚餐','🧋 飲料','🍪 點心','🥬 食材','🍎 水果'],['👕 衣','👕 衣服','👖 褲子','👟 鞋子','🧦 配件'],['🏠 住','🏠 房貸','🔑 房租','💧 水費','💡 電費','🔥 瓦斯','🧹 日用品','🔧 修繕'],['🚗 行','⛽ 加油','🅿️ 停車','🚆 交通','🔧 保養','🛣️ 過路費'],['📚 育','🏫 學費','📖 書籍','✏️ 文具','🎓 補習','🎨 才藝'],['🎡 樂','✈️ 旅遊','🎬 電影','🎮 娛樂','🎁 禮物','🎟️ 門票'],['🏥 醫','🏥 看診','💊 藥品','🩺 健檢'],['📦 其他','🛡️ 保險','💵 稅金','🎁 人情']];let ci=0,ii=-1;function tiles(){ $('categories').innerHTML=cats.map((c,i)=>`<button class="tile ${i===ci?'chosen':''}" onclick="ci=${i};ii=-1;tiles()">${c[0]}</button>`).join('');$('items').innerHTML=[...cats[ci].slice(1),'✏️ 其他'].map((s,i)=>`<button class="tile ${i===ii?'chosen':''}" onclick="ii=${i};tiles()">${s}</button>`).join('');$('locked').textContent='🔒 '+cats[ci][0]+' / '+([...cats[ci].slice(1),'✏️ 其他'][ii]||'尚未選擇')}
function addExpense(){let a=Number($('expenseAmount').value),d=$('expenseDate').value,n=$('expenseName').value.trim(),item=[...cats[ci].slice(1),'✏️ 其他'][ii];if(!item||!validDate(d)||!Number.isFinite(a)||a<=0)return alert('請選擇細項、日期及有效金額');expenses.unshift({name:n||item.split(' ').slice(1).join(' '),amount:a,category:cats[ci][0].split(' ')[1],item,date:d,note:$('note').value});mon=new Date(d+'T12:00:00');$('expenseAmount').value=$('expenseName').value=$('note').value='';save()}const sum=a=>a.reduce((s,e)=>s+(Number(e.amount)||0),0), monthRows=m=>expenses.filter(e=>validDate(e.date)&&e.date.slice(0,7)===key(m).slice(0,7));function expenseRow(e,i){return `<div class="entry"><div>${esc(e.name)}<br><small>${esc(e.category)} · ${esc(e.date||'未填日期')} ${esc(e.note||'')}</small>${!validDate(e.date)?`<input type="date" onchange="setExpenseDate(${i},this.value)">`:''}</div><b>${money(Number(e.amount)||0)}</b><button class="del" onclick="del('expenses',${i})">刪除</button></div>`}function setExpenseDate(i,d){if(validDate(d)){expenses[i].date=d;save()}}function finance(){let rows=monthRows(mon),total=sum(rows);$('moneyMonth').textContent=`${mon.getFullYear()} 年 ${mon.getMonth()+1} 月`;$('total').textContent=money(total);$('otherTotals').textContent='上月 '+money(sum(monthRows(new Date(mon.getFullYear(),mon.getMonth()-1,1))))+' ｜ 年度 '+money(sum(expenses.filter(e=>validDate(e.date)&&e.date.startsWith(mon.getFullYear()+'-'))));let months=Array.from({length:6},(_,i)=>new Date(mon.getFullYear(),mon.getMonth()-5+i,1)),values=months.map(m=>sum(monthRows(m))),max=Math.max(1,...values);$('trend').innerHTML=months.map((m,i)=>`<p>${m.getFullYear()}/${m.getMonth()+1}　${money(values[i])}</p><div class="bar" style="width:${100*values[i]/max}%"></div>`).join('');let groups={};rows.forEach(e=>{let c=({'飲食':'食','日用品':'住','交通':'行','教育':'育','醫療':'醫'}[e.category]||e.category||'其他');groups[c]=(groups[c]||0)+Number(e.amount)});$('breakdown').innerHTML=Object.entries(groups).map(([c,v])=>`<p>${esc(c)}　${money(v)}　${(v/total*100).toFixed(1)}%</p><div class="bar" style="width:${v/total*100}%"></div>`).join('')||'尚無紀錄';$('expenseList').innerHTML=expenses.map((e,i)=>rows.includes(e)?expenseRow(e,i):'').join('')||'尚無紀錄';$('undated').innerHTML=expenses.map((e,i)=>!validDate(e.date)?expenseRow(e,i):'').join('')||'無';$('moneySummary').textContent=money(sum(monthRows(new Date())))}
function addMemory(){let title=$('memoryTitle').value.trim();if(!title)return;memories.unshift({title,date:$('memoryDate').value||today(),text:$('memoryText').value});$('memoryTitle').value=$('memoryText').value='';save()}const fields={name:'stName',sub:'stSub',slogan:'stSlogan',bless:'stBless',icon:'stIcon',theme:'stTheme',font:'stFont',lunar:'stLunar',fest:'stFest'};function fillSettings(){for(let k in fields)$(fields[k]).value=settings[k]}function saveSettings(){for(let k in fields)settings[k]=$(fields[k]).value.trim()||defaults[k];save();show('home')}function resetSettings(){if(confirm('恢復介面設定？家庭紀錄不受影響。')){settings={...defaults};save();fillSettings()}}function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function backup(){download('FamilyHome-'+today()+'.json',JSON.stringify({version:'0.3',tasks,expenses,memories,settings},null,2),'application/json')}async function restore(input){try{let b=JSON.parse(await input.files[0].text());if(!Array.isArray(b.tasks)||!Array.isArray(b.expenses)||!Array.isArray(b.memories)||!b.tasks.every(t=>t&&typeof t.text==='string'&&validDate(t.date))||!b.expenses.every(e=>e&&typeof e.name==='string'&&Number.isFinite(Number(e.amount))&&Number(e.amount)>0)||!b.memories.every(m=>m&&typeof m.title==='string'))throw Error();if(confirm('還原將取代目前資料，確定？')){tasks=b.tasks;expenses=b.expenses;memories=b.memories;settings={...defaults,...b.settings};save();fillSettings()}}catch{alert('備份格式不正確')}input.value=''}function csv(){let q=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';download('expenses-'+key(mon).slice(0,7)+'.csv','\ufeff'+[['日期','分類','項目','金額','備註'],...monthRows(mon).map(e=>[e.date,e.category,e.name,e.amount,e.note])].map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function render(){document.documentElement.style.setProperty('--theme',/^#[0-9a-f]{6}$/i.test(settings.theme)?settings.theme:defaults.theme);document.documentElement.style.setProperty('--fs',(['16','18','20'].includes(settings.font)?settings.font:'16')+'px');$('heading').textContent=settings.icon+' '+settings.name;document.title=settings.name;$('subtitle').textContent=settings.sub+' · Version 0.3';$('slogan').textContent=settings.slogan;$('blessing').textContent=settings.bless;$('familyName').textContent=settings.name;calendar();let sorted=tasks.map((t,i)=>({t,i})).sort((a,b)=>String(a.t.date).localeCompare(String(b.t.date)));for(let [id,filter] of [['taskList',t=>t.date===selected],['upcoming',t=>!t.done],['completed',t=>t.done]])$(id).innerHTML=sorted.filter(x=>filter(x.t)).map(x=>taskRow(x.t,x.i)).join('')||'尚無事項';$('taskSummary').textContent=tasks.filter(t=>!t.done).length+' 件待辦事項';$('memorySummary').textContent=memories.length+' 則生活回憶';$('memoryList').innerHTML=memories.map((m,i)=>`<div class="card"><small>${esc(m.date)}</small><h2>${esc(m.title)}</h2><p style="white-space:pre-wrap">${esc(m.text)}</p><button class="del" onclick="del('memories',${i})">刪除</button></div>`).join('');finance();tiles()}$('memoryDate').value=$('expenseDate').value=today();render();
</script></html>
